<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="작은 아이디어를 시작하는 공간, Hmm.." />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Hmm.. — 작은 생각의 시작</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#top" aria-label="Hmm 홈">Hmm<span>..</span></a>
      <p class="status"><span aria-hidden="true"></span> 지금 생각하는 중</p>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">A PLACE FOR SMALL IDEAS</p>
        <h1 id="hero-title">좋은 시작은 보통<br /><em>“음…”</em>에서 나옵니다.</h1>
        <p class="intro">아직 정확하지 않아도 괜찮아요. 작은 질문 하나를 꺼내 놓고, 그다음 생각을 시작해 보세요.</p>
        <div class="idea-card">
          <p class="card-label">오늘의 작은 질문</p>
          <p id="idea" class="idea" aria-live="polite">오늘 딱 하나 바꿀 수 있다면 무엇일까요?</p>
          <button id="ideaButton" type="button">다른 질문 보기 <span aria-hidden="true">↗</span></button>
        </div>
      </section>
    </main>
    <footer>
      <p>첫 번째 페이지, <span id="year"></span></p>
      <p>Made with a little curiosity.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
