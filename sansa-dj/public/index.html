<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sansa DJ · 사이버 산사 라운지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrap">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="temple-mark">⛩️</span>
        <div class="brand-text">
          <h1>산사 DJ · SANSA LOUNGE</h1>
          <p class="sub">말없이 함께 비트 타는 온라인 라운지</p>
        </div>
      </div>
      <div class="room-stats">
        <span class="live-indicator">LIVE</span>
        <span id="listener-count">48명 함께 듣는 중</span>
      </div>
    </header>

    <!-- Main Stage / DJ Booth -->
    <section class="stage-section">
      <div class="stage-backdrop">
        <div class="neon-lantern lantern-left">🏮</div>
        <div class="visualizer-container" id="visualizer">
          <!-- Visualizer bars generated by JS -->
        </div>
        <div class="neon-lantern lantern-right">🏮</div>
      </div>

      <!-- DJ Booth Deck -->
      <div class="dj-booth">
        <div class="dj-avatar-badge">
          <div class="avatar-head dj-head">🎧</div>
          <div class="dj-name-tag">
            <span class="role">RESIDENT DJ</span>
            <span class="name" id="current-dj-name">@2997-maker</span>
          </div>
        </div>

        <div class="turntable-container">
          <div class="vinyl-record" id="vinyl">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-label">SANSA</div>
          </div>
          <div class="tonearm" id="tonearm"></div>
        </div>

        <div class="track-info">
          <div class="track-title" id="track-title">Chill Sunset Lofi Session #07</div>
          <div class="track-meta">
            <span id="track-bpm">BPM 84</span> · <span id="track-time">01:24 / 03:45</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Audience Floor (산사 법당 스타일의 객석) -->
    <section class="floor-section">
      <div class="floor-label">FLOOR · 조용히 머무는 공간</div>
      <div class="audience-grid" id="audience-grid">
        <!-- Avatars injected by JS -->
      </div>
      <div class="reaction-layer" id="reaction-layer"></div>
    </section>

    <!-- Bottom Controls & Interactions -->
    <footer class="bottom-panel">
      <!-- Mode Tabs: Audience vs DJ Mode -->
      <div class="role-selector">
        <button class="role-tab active" id="tab-audience">관객 모드</button>
        <button class="role-tab" id="tab-dj">DJ 부스 콘솔</button>
      </div>

      <!-- Audience Reaction Toolbar (산사 식의 가벼운 인터랙션) -->
      <div class="control-view" id="audience-controls">
        <div class="reactions-bar">
          <button class="rx-btn" data-reaction="glowstick">
            <span class="rx-icon">🪄</span>
            <span class="rx-text">야광봉</span>
          </button>
          <button class="rx-btn" data-reaction="headbang">
            <span class="rx-icon">🕺</span>
            <span class="rx-text">둠칫</span>
          </button>
          <button class="rx-btn" data-reaction="fire">
            <span class="rx-icon">🔥</span>
            <span class="rx-text">드랍</span>
          </button>
          <button class="rx-btn" data-reaction="namaste">
            <span class="rx-icon">🙏</span>
            <span class="rx-text">합장</span>
          </button>
          <button class="rx-btn btn-dj-queue" id="btn-queue">
            <span class="rx-icon">🎧</span>
            <span class="rx-text">DJ 줄서기</span>
          </button>
        </div>
      </div>

      <!-- DJ Console Panel (실제 DJ 조작 패널) -->
      <div class="control-view hidden" id="dj-controls">
        <div class="dj-console-grid">
          <div class="dj-primary-btns">
            <button class="console-btn btn-play" id="btn-play-toggle">▶ 음악 재생</button>
            <button class="console-btn btn-fx" data-fx="scratch">💽 스크래치</button>
            <button class="console-btn btn-fx" data-fx="horn">🎺 에어혼</button>
          </div>
          <div class="fader-group">
            <label>필터 (Lowpass Sweep)</label>
            <input type="range" min="200" max="8000" value="4000" class="slider" id="filter-slider">
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
