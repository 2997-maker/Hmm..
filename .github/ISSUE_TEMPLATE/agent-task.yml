name: 에이전트 작업 요청
description: Codex–Prime Agent 자동화 작업을 위한 표준 요청 양식입니다.
title: "[자동화] "
body:
  - type: markdown
    attributes:
      value: |
        ## 비밀정보 입력 금지
        비밀번호, API 키, 토큰, 인증 정보, 개인 정보 등 비밀정보를 이슈에 입력하지 마세요.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업으로 달성하려는 목표를 작성해 주세요.
      placeholder: "예: 배포 전 검사 절차를 문서화한다."
    validations:
      required: true

  - type: textarea
    id: current-problem
    attributes:
      label: 현재 문제
      description: 현재 상황과 해결이 필요한 문제를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: desired-result
    attributes:
      label: 원하는 결과
      description: 작업 후 기대하는 결과를 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 작업 완료로 판단할 수 있는 검증 가능한 조건을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: do-not-change
    attributes:
      label: 수정하면 안 되는 부분
      description: 유지해야 하는 파일, 기능, 설정 또는 범위를 작성해 주세요.
      placeholder: 없으면 비워 두세요.

  - type: textarea
    id: references
    attributes:
      label: 참고 화면 또는 링크
      description: 참고할 화면, 문서, 이슈 또는 URL을 작성해 주세요.
      placeholder: 없으면 비워 두세요.

  - type: textarea
    id: additional-validation
    attributes:
      label: 추가 검증 사항
      description: 기본 검증 외에 필요한 테스트나 확인 사항을 작성해 주세요.
      placeholder: 없으면 비워 두세요.
